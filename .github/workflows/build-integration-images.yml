name: Build Integration Images

on:
  pull_request:
    branches:
      - master
    paths:
      - Dockerfile
      - integrations/telegram/**
      - integrations/whatsapp/**
      - integrations/slack/**
      - integrations/instagram/**
      - integrations/messenger/**
      - integrations/build-utils/**
      - interfaces/**
      - packages/**
      - patches/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - tsconfig.json
      - turbo.json
      - .github/workflows/build-integration-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: integration-images

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - integration: telegram
            target: telegram
            platform: linux/amd64
          - integration: whatsapp
            target: whatsapp
            platform: linux/amd64
          - integration: slack
            target: slack
            platform: linux/amd64
          - integration: instagram
            target: instagram
            platform: linux/amd64
          - integration: messenger
            target: messenger
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.integration }} image
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: false
          tags: local/${{ env.IMAGE_NAME }}:${{ matrix.integration }}-${{ steps.source.outputs.sha }}
