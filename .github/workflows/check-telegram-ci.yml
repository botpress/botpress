name: Check Telegram CI Config

on:
  pull_request:
    paths:
      - '.ci/**/*.ts'
      - '.ci/package.json'
      - '.ci/pnpm-lock.yaml'
      - '.ci/tsconfig.json'
      - '.github/workflows/check-telegram-ci.yml'
  push:
    branches:
      - master
    paths:
      - '.ci/**/*.ts'
      - '!.ci/.dab/**'
      - '!.ci/node_modules/**'
      - '!.ci/.dab-state/**'
      - '.ci/package.json'
      - '.ci/pnpm-lock.yaml'
      - '.ci/tsconfig.json'
      - '.github/workflows/check-telegram-ci.yml'
  workflow_dispatch:

jobs:
  check-telegram-ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          registry-url: https://npm.pkg.github.com
          scope: '@botpress-private'
      - run: pnpm install --frozen-lockfile
        working-directory: .ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PRIVATE_NPM_TOKEN }}
      - uses: botpress/dab/setup@action-v1
        with:
          environment: staging
          infisical-client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          config-file: ./.ci/telegram.ts
      - run: pnpm run check:type
        working-directory: .ci
