name: Deploy Chat Production

on:
  workflow_dispatch:
    inputs:
      branchOrCommit:
        description: 'Branch/Commit/Tag to deploy'
        required: false
        type: string
        default: 'master'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # The runtime is deployed to EKS by DAB (see trigger-dab-configured-integrations-deploy-*.yml);
  # this job only registers the integration definition and points it at that deployment.
  deploy-chat-definition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ inputs.branchOrCommit || github.sha }}
      - name: Setup
        uses: ./.github/actions/setup
      - name: Deploy integration definition
        run: |
          pnpm bp login -y --api-url "https://api.botpress.cloud" --workspaceId "${{ secrets.PRODUCTION_CLOUD_OPS_WORKSPACE_ID }}" --token "${{ secrets.PRODUCTION_TOKEN_CLOUD_OPS_ACCOUNT }}"
          pnpm -F "{integrations/chat}" -c exec -- bp deploy -v -y --noBuild --visibility public --allowDeprecated --url https://integration-chat.foundation.botpress.cloud

  ping-success:
    needs: [deploy-chat-definition]
    runs-on: ubuntu-latest
    steps:
      - run: curl -m 10 --retry 5 "${{ secrets.CHAT_DEPLOY_PRODUCTION_PING_URL }}"

  ping-failure:
    needs: [deploy-chat-definition]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - run: curl -m 10 --retry 5 "${{ secrets.CHAT_DEPLOY_PRODUCTION_PING_URL }}/fail"
