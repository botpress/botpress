name: Deploy All DAB-Configured Integrations Production

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: integration-images

jobs:
  tag-images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - integration: telegram
    steps:
      - uses: aws-actions/configure-aws-credentials@v3
        with:
          role-session-name: container_pusher
          role-to-assume: arn:aws:iam::986677156374:role/actions/build/container_pusher
          aws-region: us-east-1

      - name: Tag commit image as production
        env:
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          INTEGRATION: ${{ matrix.integration }}
        run: |
          source_tag="${INTEGRATION}-${GITHUB_SHA}"
          production_tag="${INTEGRATION}-production"
          image_digest=$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$source_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)
          image_manifest=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$source_tag" \
            --query 'images[0].imageManifest' \
            --output text)

          if [ -z "$image_manifest" ] || [ "$image_manifest" = "None" ]; then
            echo "::error::No ECR image found for $ECR_REPOSITORY:$source_tag"
            exit 1
          fi

          if ! aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "$production_tag" \
            --image-manifest "$image_manifest" \
            > /dev/null; then
            production_digest=$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$production_tag" \
              --query 'imageDetails[0].imageDigest' \
              --output text 2> /dev/null || true)

            if [ "$production_digest" = "$image_digest" ]; then
              echo "$ECR_REPOSITORY:$production_tag already points at $image_digest"
              exit 0
            fi

            echo "::error::Failed to tag $ECR_REPOSITORY:$source_tag as $production_tag"
            exit 1
          fi

  trigger:
    needs: tag-images
    runs-on: ubuntu-latest
    steps:
      - name: Acquire a short-lived access token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PRIVATE_DEPLOYS_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_DEPLOYS_PRIVATE_KEY }}
          owner: botpress
          repositories: private-deploys

      - name: Dispatch private integration deploy
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'botpress',
              repo: 'private-deploys',
              event_type: 'deploy-integration',
              client_payload: {
                integration: '*',
                env: 'production'
              }
            });
